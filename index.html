<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020208;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .space {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(236, 72, 153, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.2) 0%, transparent 60%);
            filter: blur(80px);
            animation: pulseBg 12s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.3) rotate(180deg); opacity: 1; }
        }

        .core-container {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            animation: rotateCore 25s linear infinite;
        }

        @keyframes rotateCore {
            0% { transform: rotateX(25deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(25deg) rotateY(360deg) rotateZ(360deg); }
        }

        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            mix-blend-mode: screen;
        }

        .ring:nth-child(1) {
            border-top: 3px solid #ec4899;
            border-bottom: 3px solid #06b6d4;
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.5), inset 0 0 35px rgba(6, 182, 212, 0.5);
            animation: spinRing1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ring:nth-child(2) {
            border-left: 3px solid #8b5cf6;
            border-right: 3px solid #3b82f6;
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.5), inset 0 0 35px rgba(59, 130, 246, 0.5);
            animation: spinRing2 6s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
        }

        .ring:nth-child(3) {
            border-top: 3px solid #10b981;
            border-left: 3px solid #f59e0b;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.5), inset 0 0 35px rgba(245, 158, 11, 0.5);
            animation: spinRing3 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spinRing1 {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
        }

        @keyframes spinRing2 {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(180deg) rotateY(360deg) rotateZ(180deg); }
        }

        @keyframes spinRing3 {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(0deg); }
        }

        .nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            margin: -60px 0 0 -60px;
            background: radial-gradient(circle, #ffffff 0%, #ec4899 40%, #3b82f6 80%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #ec4899, 0 0 120px #3b82f6;
            animation: pulseNucleus 2s ease-in-out infinite alternate;
        }

        @keyframes pulseNucleus {
            0% { transform: scale(0.85); filter: brightness(1); }
            100% { transform: scale(1.15); filter: brightness(1.4); }
        }

        .grid-floor {
            position: absolute;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg) translateZ(-200px);
            animation: moveGrid 15s linear infinite;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }
    </style>
</head>
<body>
    <div class="space"></div>
    <div class="grid-floor"></div>
    <div class="core-container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="nucleus"></div>
    </div>
</body>
</html>
