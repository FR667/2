<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cloud Open AI - 網路開源 AI 工作站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="glass-panel border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-cloud text-white text-lg"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-wider text-white">NEXUS CLOUD AI</span>
                    <span class="block text-[10px] text-purple-400 tracking-widest uppercase">Free Open-Source Cloud Hub</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openSettings()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-3.5 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-key text-purple-400"></i> 設定免費金鑰
                </button>
            </div>
        </div>
    </header>

    <!-- 主要操作區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- 左側選單 -->
        <div class="lg:col-span-1 space-y-3">
            <div class="text-xs font-semibold text-slate-400 px-3 tracking-wider">雲端開源模型</div>
            <div class="p-4 rounded-2xl glass-panel space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">選擇免費模型代號</label>
                    <select id="model-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (免費開源)</option>
                        <option value="deepseek/deepseek-r1:free">DeepSeek R1 (免費開源推理)</option>
                        <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (免費雲端)</option>
                    </select>
                </div>
                <p class="text-[11px] text-slate-400 leading-relaxed">
                    提示：您可以至 <a href="https://openrouter.ai" target="_blank" class="text-purple-400 underline">OpenRouter.ai</a> 免費註冊帳號（免信用卡），取得一組免費 API Key 貼上即可使用其提供的免費開源模型。
                </p>
            </div>

            <button onclick="switchTab('chat')" id="btn-chat" class="w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition flex items-center gap-3 bg-purple-600 text-white shadow-lg shadow-purple-600/20">
                <i class="fa-solid fa-brain w-5"></i> 雲端智能對話
            </button>
            <button onclick="switchTab('code')" id="btn-code" class="w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition flex items-center gap-3 text-slate-400 hover:bg-slate-900 hover:text-slate-200">
                <i class="fa-solid fa-code w-5"></i> 程式碼智慧解析
            </button>
        </div>

        <!-- 右側動態面板 -->
        <div class="lg:col-span-3 flex flex-col glass-panel rounded-2xl shadow-2xl overflow-hidden min-h-[650px]">

            <!-- 1. 聊天室模組 -->
            <div id="section-chat" class="workspace-section flex-1 flex flex-col">
                <div class="p-4 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between">
                    <span class="font-semibold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-comments text-purple-400"></i> 雲端開源聊天室</span>
                    <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg transition">清空對話</button>
                </div>
                
                <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 max-h-[520px]">
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white shrink-0 text-xs shadow"><i class="fa-solid fa-robot"></i></div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-200 max-w-xl shadow-sm leading-relaxed">
                            您好！請點擊右上角「設定免費金鑰」填入您的 OpenRouter Key，即可透過網路雲端免費使用各大頂級開源模型（如 Llama、DeepSeek）。
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-slate-900/80 border-t border-slate-800">
                    <form onsubmit="handleChatSubmit(event)" class="flex gap-2">
                        <input type="text" id="chat-input" placeholder="輸入想問的問題..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-600/20">發送</button>
                    </form>
                </div>
            </div>

            <!-- 2. 程式碼模組 -->
            <div id="section-code" class="workspace-section hidden flex-1 flex flex-col p-6 space-y-4">
                <h2 class="font-semibold text-white text-base flex items-center gap-2"><i class="fa-solid fa-code text-purple-400"></i> 雲端程式碼重構與解析</h2>
                <textarea id="code-input" placeholder="貼上程式碼..." class="w-full h-36 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-purple-300 font-mono resize-none focus:outline-none focus:border-purple-500"></textarea>
                <button onclick="runCodeTask()" class="bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl text-sm font-medium transition">分析程式碼</button>
                <div id="code-result" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-300 font-mono whitespace-pre-wrap hidden"></div>
            </div>

        </div>
    </main>

    <!-- 設定 Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="font-semibold text-white text-lg flex items-center gap-2"><i class="fa-solid fa-key text-purple-400"></i> 設定免費雲端金鑰</h3>
            <p class="text-xs text-slate-400">請至 OpenRouter 免費申請一組金鑰（不需要填信用卡）並貼在下方：</p>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettings()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm">取消</button>
                <button onclick="saveSettings()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-xl text-sm">儲存金鑰</button>
            </div>
        </div>
    </div>

    <!-- 互動邏輯核心 -->
    <script>
        let apiKey = localStorage.getItem('nexus_cloud_key') || '';

        function openSettings() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }
        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('flex');
            document.getElementById('settings-modal').classList.add('hidden');
        }
        function saveSettings() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('nexus_cloud_key', apiKey);
            closeSettings();
            alert('金鑰已儲存！');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.workspace-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('section-' + tabId).classList.remove('hidden');

            ['chat', 'code'].forEach(t => {
                const btn = document.getElementById('btn-' + t);
                if (t === tabId) {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition flex items-center gap-3 bg-purple-600 text-white shadow-lg shadow-purple-600/20";
                } else {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition flex items-center gap-3 text-slate-400 hover:bg-slate-900 hover:text-slate-200";
                }
            });
        }

        async function callCloudAI(promptText) {
            if (!apiKey) {
                return "【系統提示】尚未設定免費金鑰。請點擊右上角「設定免費金鑰」輸入您的 OpenRouter Key（可至 openrouter.ai 免費申請，無需信用卡）。";
            }
            const model = document.getElementById('model-select').value;
            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Nexus Cloud AI'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: promptText }]
                    })
                });
                const data = await res.json();
                if (data.choices && data.choices.length > 0) {
                    return data.choices[0].message.content;
                } else if (data.error) {
                    return `【API 錯誤】${data.error.message}`;
                }
            } catch (err) {
                return `【連線失敗】無法連接至雲端 API：${err.message}`;
            }
            return "雲端模型未返回內容。";
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="flex items-start justify-end space-x-3"><div class="bg-purple-600 rounded-2xl px-4 py-3 text-sm text-white max-w-xl">${escapeHtml(text)}</div></div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'load-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="flex items-start space-x-3"><div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white shrink-0 text-xs shadow"><i class="fa-solid fa-robot"></i></div><div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-400 animate-pulse">雲端開源模型運算中...</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const reply = await callCloudAI(text);
            document.getElementById(loadingId).remove();

            chatBox.innerHTML += `<div class="flex items-start space-x-3"><div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white shrink-0 text-xs shadow"><i class="fa-solid fa-robot"></i></div><div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-200 max-w-xl shadow-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(reply)}</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chat-box').innerHTML = `<div class="flex items-start space-x-3"><div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white shrink-0 text-xs shadow"><i class="fa-solid fa-robot"></i></div><div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-200 max-w-xl shadow-sm">對話已清除。</div></div>`;
        }

        async function runCodeTask() {
            const code = document.getElementById('code-input').value;
            const resBox = document.getElementById('code-result');
            if (!code) return;
            resBox.classList.remove('hidden');
            resBox.innerText = "雲端開源模型正在解析程式碼...";
            const res = await callCloudAI("請幫我分析以下程式碼並給予優化建議：\n" + code);
            resBox.innerText = res;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
